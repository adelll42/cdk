alb:
  - name: transendence-alb
    endpoint_ssm: "/transendence/alb/arn"
    redirect_http: true

    route53:
      domain_name: dev.yospace.ai
      subdomain: transendence
      alb_arn: transendence-alb

    services:
      - name: frontend
      - name: backend

    target_groups:
      frontend:
        port: 80
        health_path: /
        target_type: instance
      backend:
        port: 3000
        health_path: /api/health
        target_type: instance

    routing:
      - name: ApiRoute
        priority: 1
        path: "/api/*"
        target: backend
      - name: AvatarsRoute
        priority: 2
        path: "/avatars/*"
        target: backend
      - name: DefaultRoute
        priority: 10
        path: "/*"
        target: frontend

    instances:
      - id: i-04785120cbd377b64
        az: eu-west-2a
        private_ip: 10.0.0.124
        targets:
          - group: backend
            port: 3000
          - group: frontend
            port: 80

    vpc: transendence
    cluster: transendence
    certificate: transendence-dev-cert
